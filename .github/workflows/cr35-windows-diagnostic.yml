name: CR35 Windows diagnostic

on:
  push:
    branches:
      - cr35-windows-diagnostic-20261017

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: 22.x
  PNPM_VERSION: 9.15.0

jobs:
  windows-diagnostic:
    name: Windows strict Turbo environment subset probe
    if: ${{ github.repository == 'LeMark0/bb' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      RELEASE_COMMIT: 5a8f444b5e119ddfa0d02b4ae72f0fe910b93e56

    steps:
      - name: Check out the diagnostic helpers
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diag
          persist-credentials: false

      - name: Check out the exact release source
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5a8f444b5e119ddfa0d02b4ae72f0fe910b93e56
          path: release
          persist-credentials: false

      - name: Setup Node.js
        timeout-minutes: 1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        timeout-minutes: 1
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Verify the release source and install its Turbo
        id: install
        timeout-minutes: 3
        working-directory: release
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          ENV_EVIDENCE_DIR: ${{ runner.temp }}/cr35-env-evidence
        run: |
          mkdir -p "$ENV_EVIDENCE_DIR"
          cat > "$ENV_EVIDENCE_DIR/expected-blobs.txt" <<'EOF'
          ad88c82284e96080a03608bcc770e234d0e7174c packages/config/test/verified-process-stop.test.ts
          250f2bc180d0b13fb69c256f0d02e9e5cb4dfdb6 packages/process-utils/src/process-info.ts
          c0e46ea2e99d9b97d14c8119e048910daa6fcf3b packages/config/src/verified-process-stop.ts
          9688014f0286e6e82318026c14ffaeb2ad72cd4a packages/config/vitest.config.ts
          1a17fdf94c46c8d1ba808448ee671ddce8efdb44 packages/config/package.json
          52f92263042b00e486bb1259bdfeed9dcf4741c5 turbo.json
          b8893c170354db69058799370f48add089da46e9 pnpm-lock.yaml
          EOF
          {
            echo "commit $(git rev-parse HEAD)"
            while read -r blob path; do
              echo "$(git hash-object "$path") $(sha256sum "$path" | cut -d' ' -f1) $path"
            done < "$ENV_EVIDENCE_DIR/expected-blobs.txt"
            echo "tracked-changes $(git status --porcelain --untracked-files=no | wc -l)"
          } > "$ENV_EVIDENCE_DIR/source-before.txt"
          cat "$ENV_EVIDENCE_DIR/source-before.txt"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          while read -r blob path; do
            test "$(git hash-object "$path")" = "$blob"
          done < "$ENV_EVIDENCE_DIR/expected-blobs.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
          bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter bb

      - name: Probe the production identity query under strict Turbo
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 9
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          ENV_EVIDENCE_DIR: ${{ runner.temp }}/cr35-env-evidence
          ENV_SCRATCH_DIR: ${{ runner.temp }}/cr35-env-scratch
        run: |
          node diag/scripts/diagnostics/cr35-windows/env-probe-host.mjs prepare --release "$GITHUB_WORKSPACE/release" --scratch "$ENV_SCRATCH_DIR" --evidence "$ENV_EVIDENCE_DIR"
          {
            echo "node $(node --version)"
            echo "pnpm $(pnpm --version)"
            echo "turbo $(pnpm --dir release exec turbo --version)"
            echo "diagnostic $(git -C diag rev-parse HEAD)"
          } > "$ENV_EVIDENCE_DIR/versions.txt"
          if pnpm --dir release exec turbo run probe --cwd "$ENV_SCRATCH_DIR" --env-mode=strict --output-logs=full > "$ENV_SCRATCH_DIR/private/turbo-probe.log" 2>&1; then
            probe=0
          else
            probe=$?
          fi
          grep -oE '(B[123]|U1|L1|P1|LP1|S[23]|R-[A-Za-z_]+) \[[A-Za-z_,]*\] (verified|timeout|process-failure|invalid-identity) [0-9]+ms|stop: (budget-max-invocations|budget-deadline|no-allowlisted-name-removed|baseline-unusable|baseline-not-slow|bundle-does-not-restore|subset-supported|subset-not-repeated); subset: (null|\[[A-Za-z_",]*\]); supported: (true|false)|harness error: (names|reader-parity|reader-import|values|child-start|plan|summary) [A-Za-z]+ [A-Za-z0-9_-]+' "$ENV_SCRATCH_DIR/private/turbo-probe.log" > "$ENV_EVIDENCE_DIR/probe-lines.txt" || true
          rm -rf "$ENV_SCRATCH_DIR/private"
          {
            echo "commit $(git -C release rev-parse HEAD)"
            while read -r blob path; do
              echo "$(git -C release hash-object "$path") $(sha256sum "release/$path" | cut -d' ' -f1) $path"
            done < "$ENV_EVIDENCE_DIR/expected-blobs.txt"
            echo "tracked-changes $(git -C release status --porcelain --untracked-files=no | wc -l)"
          } > "$ENV_EVIDENCE_DIR/source-after.txt"
          if cmp -s "$ENV_EVIDENCE_DIR/source-before.txt" "$ENV_EVIDENCE_DIR/source-after.txt"; then
            source=0
            echo "source unchanged" > "$ENV_EVIDENCE_DIR/source-comparison.txt"
          else
            source=1
            echo "source CHANGED during the probe" > "$ENV_EVIDENCE_DIR/source-comparison.txt"
          fi
          echo "turbo=$probe source=$source" | tee "$ENV_EVIDENCE_DIR/step-result.txt"
          cat "$ENV_EVIDENCE_DIR/probe-lines.txt"
          test "$probe" -eq 0 && test "$source" -eq 0

      - name: Remove private probe values and scan the evidence
        id: cleanup
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          ENV_EVIDENCE_DIR: ${{ runner.temp }}/cr35-env-evidence
          ENV_SCRATCH_DIR: ${{ runner.temp }}/cr35-env-scratch
        run: |
          scratch=0
          rm -rf "$ENV_SCRATCH_DIR" || scratch=$?
          scan=missing
          if [ -d "$ENV_EVIDENCE_DIR" ]; then
            rm -f "$ENV_EVIDENCE_DIR/leak-scan.json"
            scan=0
            node diag/scripts/diagnostics/cr35-windows/env-probe-host.mjs scan --evidence "$ENV_EVIDENCE_DIR" || scan=$?
            if { [ "$scan" -eq 0 ] || [ "$scan" -eq 3 ]; } && [ -f "$ENV_EVIDENCE_DIR/leak-scan.json" ]; then
              echo "scanned=true" >> "$GITHUB_OUTPUT"
            else
              rm -rf "$ENV_EVIDENCE_DIR"
            fi
          fi
          echo "scratch removal exit $scratch; leak scan exit $scan"
          test "$scratch" -eq 0 && test "$scan" = 0

      - name: Upload diagnostic evidence
        if: ${{ !cancelled() && steps.cleanup.outputs.scanned == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cr35-windows-env-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cr35-env-evidence
          retention-days: 7
          if-no-files-found: error
